spring:
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/VAMA}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

allowed:
  origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-in-production-min-32-chars}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never